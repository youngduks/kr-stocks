name: Update Buyback (SK하이닉스 자사주)

# 한국 정규장 마감 후 (KST 17:00 = UTC 08:00) 평일 자동 실행.
# KIND 자기주식취득/처분 조회 스크랩 → data/buyback/hynix.json 갱신 → Vercel auto deploy.
#
# ⚠️ 매입기간 2026-08-20~2026-11-19 한시적 프로그램 — 종료 후 이 워크플로우는
# 비활성화(disable) 대상. 신고내역이 더 안 늘어나면 스크립트가 자연히 no-op이 됨.
on:
  schedule:
    - cron: "0 8 * * 1-5"   # UTC 월~금 08:00 → KST 17:00
  workflow_dispatch:          # 수동 실행도 허용

permissions:
  contents: write              # commit + push 권한

concurrency:
  group: update-buyback
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        run: node scripts/update-buyback.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/buyback/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/buyback/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "kr-stocks-bot"
          git config user.email "bot@kr-stocks.com"
          git add data/buyback/
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          git commit -m "chore(data): auto-update buyback ${DATE_KST}

          SK하이닉스 자사주 매입 진행 현황 — KRX KIND 공시 스크랩.
          Source: https://kind.krx.co.kr/corpgeneral/treasurystk.do
          "
          git push
