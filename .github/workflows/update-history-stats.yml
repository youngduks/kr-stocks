name: Update History Stats (과거 사례 통계)

# 미국 반도체(^SOX) 전일 등락 → 다음 한국 거래일 삼성전자·SK하이닉스 등락 통계를 주 1회 재계산.
# 데이터: Yahoo chart API(일봉 5년) + 네이버 fchart(거래소 공식 종가). 유료 API 없음.
# 스크립트는 실패 시 기존 파일을 건드리지 않고 exit 1 → 커밋 없음(화면은 직전 통계 유지).
# Yahoo 가 GitHub Actions IP 를 막으면(429 지속) 로컬 Mac launchd 로 대체 — scripts/history-stats.mjs 상단 주석 참고.
on:
  schedule:
    - cron: "0 0 * * 6"   # UTC 토 00:00 → KST 토 09:00 (한·미 주간 거래 마감 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-history-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute stats
        run: node scripts/history-stats.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/history-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/history-stats.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "kr-stocks-bot"
          git config user.email "bot@kr-stocks.com"
          git add data/history-stats.json
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          git commit -m "chore(data): auto-update history stats ${DATE_KST}

          과거 사례 통계 — ^SOX 전일 등락 → 다음 한국 거래일 삼성전자·SK하이닉스.
          "
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
