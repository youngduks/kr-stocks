name: Update Human Indicators (인물 지표)

# 전인구경제연구소 등 채널의 "새 영상 여부"를 매일 체크(RSS) → 새 영상이면 자막을
# Playwright로 추출 → Claude Haiku로 증시 방향성 의견인지 판정 → 맞으면 opinions에 추가.
# 새 영상이 없거나 증시 방향성 얘기가 아니면 커밋 없이 종료(매일 새 항목이 느는 건 아님).
on:
  schedule:
    - cron: "0 12 * * *"   # UTC 12:00 → KST 21:00, 매일(평일 한정 아님)
  workflow_dispatch:          # 수동 실행도 허용

permissions:
  contents: write              # commit + push 권한

concurrency:
  group: update-human-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script deps (Playwright는 이 하위 폴더에만 설치, 루트 빌드엔 무관)
        working-directory: scripts/human-indicators
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run updater
        working-directory: scripts/human-indicators
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node update.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/human_indicators.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/human_indicators.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "kr-stocks-bot"
          git config user.email "bot@kr-stocks.com"
          git add data/human_indicators.json
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          git commit -m "chore(data): auto-update human indicators ${DATE_KST}

          인물 지표 — 유튜브 채널 새 영상 체크 및 증시 의견 반영.
          "
          git push
