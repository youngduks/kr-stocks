name: Update Human Indicators (인물 지표)

# 전인구경제연구소 등 채널의 "새 영상 여부"를 매일 체크(RSS) → 새 영상이면 자막을
# yt-dlp로 추출 → Claude로 증시 방향성 의견인지 판정 → 맞으면 opinions에 추가.
# 새 영상이 없거나 증시 방향성 얘기가 아니면 커밋 없이 종료(매일 새 항목이 느는 건 아님).
#
# ⚠️ 2026-09-27: 자막 추출을 Playwright에서 yt-dlp(시스템 바이너리)로 교체하며 정기 실행을
# 대표님 맥의 launchd(com.claude-bot.kr-stocks-human-indicators, 매일 21:00 KST)로 이전
# (GHA에서 YouTube get_transcript가 400 FAILED_PRECONDITION으로 영구 차단됐던 것과는 별개로,
# 러너 IP에서 yt-dlp가 봇 차단될 가능성이 높고 ANTHROPIC_API_KEY 시크릿도 비어 있어 수동 실행(workflow_dispatch)은
# 보장되지 않음(실패분은 pending으로만 남음) — 자사주(update-buyback.yml)와 동일하게 스케줄만 제거하고
# 수동 실행 경로는 비상용으로 남김).
on:
  workflow_dispatch:          # 수동 실행도 허용

permissions:
  contents: write              # commit + push 권한

concurrency:
  group: update-human-indicators
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install yt-dlp (Node 의존성 없음 — Playwright 제거됨)
        run: python3 -m pip install --user -U yt-dlp

      - name: Run updater
        working-directory: scripts/human-indicators
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_PATH: yt-dlp
        run: node update.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data/human_indicators.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat data/human_indicators.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "kr-stocks-bot"
          git config user.email "bot@kr-stocks.com"
          git add data/human_indicators.json
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          git commit -m "chore(data): auto-update human indicators ${DATE_KST}

          인물 지표 — 유튜브 채널 새 영상 체크 및 증시 의견 반영.
          "
          git push
