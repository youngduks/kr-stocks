<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>보이스노트</title>
<meta name="description" content="회의를 녹음하면서 실시간으로 자막·번역·요약을 만드는 브라우저 앱. 서버도 API 키도 쓰지 않습니다.">
<style>
/* ───────────────────────── 디자인 토큰 ───────────────────────── */
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --card-2: #f0f2f5;
  --line: #e3e6eb;
  --text: #15191f;
  --sub: #5b6573;
  --dim: #8b95a3;
  --accent: #2f6fed;
  --accent-soft: #e6eefe;
  --rec: #e5484d;
  --rec-soft: #fdecec;
  --ok: #1f9d55;
  --ok-soft: #e5f6ec;
  --warn: #b7791f;
  --warn-soft: #fdf3e1;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 6%);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1014;
    --card: #161b21;
    --card-2: #1d242c;
    --line: #262e38;
    --text: #e8edf3;
    --sub: #9aa6b4;
    --dim: #6b7685;
    --accent: #5b8ff9;
    --accent-soft: #1b2a44;
    --rec: #ff5c61;
    --rec-soft: #3a1d20;
    --ok: #3ccf7f;
    --ok-soft: #14301f;
    --warn: #e3a948;
    --warn-soft: #382c16;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1014; --card: #161b21; --card-2: #1d242c; --line: #262e38;
  --text: #e8edf3; --sub: #9aa6b4; --dim: #6b7685; --accent: #5b8ff9;
  --accent-soft: #1b2a44; --rec: #ff5c61; --rec-soft: #3a1d20; --ok: #3ccf7f;
  --ok-soft: #14301f; --warn: #e3a948; --warn-soft: #382c16; --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
[hidden] { display: none !important; }

/* ───────────────────────── 레이아웃 ───────────────────────── */
.app-head {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 750; font-size: 17px; }
.brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
.head-actions { display: flex; gap: 6px; }

main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ───────────────────────── 버튼 ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--card-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--card-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.rec { background: var(--rec); border-color: var(--rec); color: #fff; min-height: 46px; padding: 0 22px; font-size: 15px; }
.btn.rec:hover:not(:disabled) { filter: brightness(1.06); background: var(--rec); }
.btn.small { min-height: 30px; padding: 0 11px; font-size: 13px; }
.btn.icon { width: 38px; padding: 0; }

/* ───────────────────────── 컨트롤 패널 ───────────────────────── */
.controls { padding: 16px; display: grid; gap: 14px; }
.title-input {
  width: 100%; border: 0; background: transparent; outline: none;
  font-size: 20px; font-weight: 700; padding: 2px 0;
}
.title-input::placeholder { color: var(--dim); font-weight: 600; }
.control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.lang-box { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lang-box label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
select {
  min-height: 36px; padding: 0 30px 0 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--card-2);
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px; background-repeat: no-repeat;
  color: var(--text); font-weight: 600; font-size: 14px;
}
.rec-box { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.clock { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 750; min-width: 96px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.is-recording .rec-dot { background: var(--rec); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .is-recording .rec-dot { animation: none; } }
.meter { width: 70px; height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.meter-bar { height: 100%; width: 0; background: var(--ok); transition: width .1s linear; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--card-2); color: var(--sub);
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.chip.ok::before { background: var(--ok); }
.chip.warn::before { background: var(--warn); }
.chip.off::before { background: var(--dim); }
.chip.busy::before { background: var(--accent); }

.banner { padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.5; background: var(--warn-soft); color: var(--text); display: flex; gap: 10px; align-items: flex-start; }
.banner.error { background: var(--rec-soft); }
.banner .x { margin-left: auto; border: 0; background: transparent; color: var(--sub); font-size: 16px; line-height: 1; padding: 0 2px; }

/* ───────────────────────── 본문 두 칸 ───────────────────────── */
.tabs-mobile { display: none; gap: 6px; }
.tabs-mobile .btn[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.pane { display: flex; flex-direction: column; min-height: 420px; max-height: calc(100vh - 290px); max-height: calc(100dvh - 290px); }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.pane-head h2 { margin: 0; font-size: 15px; }
.pane-meta { font-size: 12px; color: var(--dim); }
.pane-body { flex: 1; overflow-y: auto; padding: 14px 16px; overscroll-behavior: contain; }
.pane-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }

.seg-toggle { display: inline-flex; background: var(--card-2); border-radius: 999px; padding: 3px; }
.seg-toggle button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--sub); }
.seg-toggle button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* 자막 */
.line { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 4px 8px; padding: 6px 0; }
.line + .line { border-top: 1px dashed var(--line); }
.line-time { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; padding-top: 3px; }
.line-text { word-break: keep-all; overflow-wrap: anywhere; }
.line-tr { grid-column: 2; font-size: 14px; color: var(--accent); word-break: keep-all; overflow-wrap: anywhere; }
.line-tr.pending { color: var(--dim); font-style: italic; }
.line-tr.error { color: var(--warn); font-size: 12px; }
.line-lang { font-size: 10px; font-weight: 700; color: var(--dim); margin-right: 6px; letter-spacing: .3px; }
.line.interim .line-text { color: var(--sub); font-style: italic; }

.empty { text-align: center; color: var(--dim); padding: 36px 12px; font-size: 14px; line-height: 1.7; }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* 정리 */
.sum-section { margin-bottom: 18px; }
.sum-section:last-child { margin-bottom: 0; }
.sum-section h3 { margin: 0 0 8px; font-size: 12px; font-weight: 750; letter-spacing: .4px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
.sum-section h3 .n { font-weight: 600; color: var(--dim); }
.overview { background: var(--accent-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-weight: 600; margin-bottom: 18px; word-break: keep-all; }
.sum-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sum-list li { position: relative; padding-left: 14px; word-break: keep-all; overflow-wrap: anywhere; }
.sum-list li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); }
.sum-list.decision li::before { background: var(--ok); }
.sum-list.plan li::before { background: var(--accent); }
.sum-list.issue li::before { background: var(--warn); }
.topic { margin-bottom: 10px; }
.topic-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.actions { display: grid; gap: 6px; }
.action { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--card-2); }
.action-task { word-break: keep-all; overflow-wrap: anywhere; }
.action-meta { display: flex; gap: 6px; align-items: start; justify-content: flex-end; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--card); color: var(--sub); white-space: nowrap; }
.tag.due { color: var(--warn); }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.keywords span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--card-2); color: var(--sub); }
.sum-note { font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; line-height: 1.6; }
.progress { height: 4px; border-radius: 2px; background: var(--card-2); overflow: hidden; margin: 10px 0 4px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* 녹음 파일 */
.audio-box { padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.audio-box audio { flex: 1; min-width: 240px; height: 40px; }

/* ───────────────────────── 다이얼로그 ───────────────────────── */
dialog {
  width: min(560px, calc(100vw - 32px));
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); color: var(--text); padding: 0;
}
dialog::backdrop { background: rgb(0 0 0 / 40%); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 16px; }
.dlg-body { padding: 14px 16px; max-height: 65vh; overflow-y: auto; }
.session-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.session-row + .session-row { border-top: 1px solid var(--line); }
.session-info { flex: 1; min-width: 0; }
.session-title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-meta { font-size: 12px; color: var(--dim); }
.setting { display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.setting-title { font-weight: 650; }
.setting-desc { font-size: 13px; color: var(--sub); margin-top: 2px; }
.text-input { width: 100%; min-height: 36px; margin-top: 8px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card-2); }
.menu { position: absolute; z-index: 20; min-width: 200px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 6px; font-size: 14px; }
.menu button:hover:not(:disabled) { background: var(--card-2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgb(0 0 0 / 20%); }

/* ───────────────────────── 반응형 ───────────────────────── */
@media (max-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .tabs-mobile { display: flex; }
  .grid[data-tab="transcript"] #paneSummary,
  .grid[data-tab="summary"] #paneTranscript { display: none; }
  .pane { max-height: none; min-height: 55vh; }
  .rec-box { margin-left: 0; width: 100%; }
  .rec-box .clock { margin-right: auto; }
}
@media (max-width: 520px) {
  main { padding: 12px; gap: 10px; }
  .controls { padding: 14px; }
  .title-input { font-size: 18px; }
  .head-actions .label-long { display: none; }
}

/* ───────────────────────── 인쇄 ───────────────────────── */
@media print {
  .app-head, .controls, .tabs-mobile, .pane-foot, .audio-box, .seg-toggle, .toast { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; }
  .grid { display: block; }
  .grid #paneSummary, .grid #paneTranscript { display: block !important; }
  .pane { max-height: none; border: 0; box-shadow: none; break-inside: auto; }
  .pane-body { overflow: visible; }
  #paneSummary { break-after: page; }
}
</style>
</head>
<body>

<header class="app-head">
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span>보이스노트</div>
  <div class="head-actions">
    <button class="btn ghost" id="btnSessions" type="button">회의 목록</button>
    <button class="btn ghost" id="btnNew" type="button"><span>새 회의</span></button>
    <button class="btn ghost icon" id="btnSettings" type="button" aria-label="설정" title="설정">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main id="app">
  <section class="card controls" aria-label="녹음 설정">
    <input class="title-input" id="title" type="text" maxlength="80" placeholder="회의 제목 (비워 두면 자동으로 붙습니다)" aria-label="회의 제목">
    <div class="control-row">
      <div class="lang-box">
        <label>말하는 언어 <select id="speechLang" aria-label="말하는 언어"></select></label>
        <button class="btn icon small" id="btnSwap" type="button" aria-label="두 언어 바꾸기" title="두 언어 바꾸기 (상대가 말할 차례일 때)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg>
        </button>
        <label>번역 <select id="targetLang" aria-label="번역 언어"></select></label>
      </div>
      <div class="rec-box">
        <div class="clock"><span class="rec-dot" aria-hidden="true"></span><span id="clock">00:00</span></div>
        <div class="meter" aria-hidden="true"><div class="meter-bar" id="meterBar"></div></div>
        <button class="btn rec" id="btnRecord" type="button">● 녹음 시작</button>
        <button class="btn" id="btnPause" type="button" hidden>일시정지</button>
        <button class="btn" id="btnStop" type="button" hidden>■ 종료</button>
      </div>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div id="banners"></div>
  </section>

  <div class="tabs-mobile" role="tablist">
    <button class="btn small" role="tab" data-tab="transcript" aria-selected="true" type="button">자막·번역</button>
    <button class="btn small" role="tab" data-tab="summary" aria-selected="false" type="button">회의 정리</button>
  </div>

  <div class="grid" id="grid" data-tab="transcript">
    <section class="card pane" id="paneTranscript" aria-label="실시간 자막">
      <div class="pane-head">
        <h2>실시간 자막</h2>
        <span class="pane-meta" id="segCount"></span>
      </div>
      <div class="pane-body" id="transcript"></div>
    </section>

    <section class="card pane" id="paneSummary" aria-label="회의 정리">
      <div class="pane-head">
        <h2>회의 정리</h2>
        <div class="seg-toggle" role="group" aria-label="정리 방식">
          <button type="button" data-view="rule" aria-pressed="true">실시간</button>
          <button type="button" data-view="ai" aria-pressed="false">AI 정리</button>
        </div>
      </div>
      <div class="pane-body" id="summary"></div>
      <div class="pane-foot">
        <button class="btn small primary" id="btnAi" type="button">AI로 정리하기</button>
        <button class="btn small" id="btnCopy" type="button">요약 복사</button>
        <button class="btn small" id="btnExport" type="button" aria-haspopup="menu">내보내기 ▾</button>
      </div>
    </section>
  </div>

  <section class="card audio-box" id="audioBox" hidden aria-label="녹음 파일"></section>
</main>

<dialog id="dlgSessions" aria-labelledby="dlgSessionsTitle">
  <div class="dlg-head"><h2 id="dlgSessionsTitle">회의 목록</h2><button class="btn ghost small" type="button" data-close>닫기</button></div>
  <div class="dlg-body" id="sessionList"></div>
</dialog>

<dialog id="dlgSettings" aria-labelledby="dlgSettingsTitle">
  <div class="dlg-head"><h2 id="dlgSettingsTitle">설정</h2><button class="btn ghost small" type="button" data-close>닫기</button></div>
  <div class="dlg-body">
    <label class="setting">
      <input type="checkbox" id="setSaveAudio">
      <div>
        <div class="setting-title">녹음 파일 저장</div>
        <div class="setting-desc">음성을 파일로도 남깁니다(이 브라우저 안에만 저장). 일부 안드로이드 기기는 녹음과 음성 인식이 마이크를 동시에 못 쓰는데, 자막이 안 나오면 이걸 꺼 보세요.</div>
      </div>
    </label>
    <label class="setting">
      <input type="checkbox" id="setLocalSpeech">
      <div>
        <div class="setting-title">기기 내 음성 인식 (실험적)</div>

<script>
"use strict";

/* ═════════════════════════════════════════════════════════════════
   보이스노트 — 음성 녹음 · 실시간 번역 · 회의 정리
   서버도 API 키도 없다. 브라우저가 제공하는 기능만으로 동작한다.

   음성 인식  Web Speech API (기기 내 처리를 지원하면 우선 사용)
   번역       Chrome 기기 내 Translator API → (선택) MyMemory 무료 API
   회의 정리  ① 규칙 기반 — 녹음 중 즉시, 모든 브라우저
              ② 기기 내 AI — Chrome Prompt API(Gemini Nano)가 있을 때 종료 후
   저장       localStorage(텍스트) + IndexedDB(녹음 파일). 전부 이 브라우저 안.
   ═════════════════════════════════════════════════════════════════ */

const LANGS = {
  ko: { label: "한국어", short: "KO", bcp: "ko-KR", mm: "ko" },
  en: { label: "영어", short: "EN", bcp: "en-US", mm: "en" },
  ja: { label: "일본어", short: "JA", bcp: "ja-JP", mm: "ja" },
  zh: { label: "중국어", short: "ZH", bcp: "zh-CN", mm: "zh-CN" },
};
const FOREIGN = ["en", "ja", "zh"];

/* ───────────────────────── 작은 도구 ───────────────────────── */

const $ = (sel, root = document) => root.querySelector(sel);

/** 안전한 DOM 생성기. 사용자 텍스트는 언제나 textContent로만 들어간다. */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.assign(el.dataset, v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function fmtClock(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60), ss = t % 60;
  const p = (n) => String(n).padStart(2, "0");
  return hh ? `${hh}:${p(mm)}:${p(ss)}` : `${p(mm)}:${p(ss)}`;
}
function fmtDuration(ms) {
  const m = Math.round(ms / 60000);
  if (ms < 60000) return `${Math.round(ms / 1000)}초`;
  return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`;
}
function fmtDate(ts) {
  const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/**
 * 브라우저 내장 AI API는 응답 없이 멈추는 일이 있다 (Chromium 153에서
 * Translator.availability()가 끝나지 않는 것을 확인). 기다리는 쪽이 번역 큐나
 * 종료 처리라서, 멈추면 앱 전체가 멈춘다. 그래서 모든 호출에 시한을 건다.
 */
function withTimeout(promise, ms, label = "응답 시간 초과") {
  let t;
  return Promise.race([
    promise,
    new Promise((_, reject) => { t = setTimeout(() => reject(Object.assign(new Error(label), { name: "TimeoutError" })), ms); }),
  ]).finally(() => clearTimeout(t));
}

/**
 * 모델 다운로드처럼 오래 걸리는 작업용 — 진행 이벤트가 끊긴 채 idleMs가 지나면 실패.
 * start(onActivity)는 진행 이벤트마다 onActivity()를 불러야 한다.
 */
function withIdleTimeout(start, idleMs, label = "응답이 없어 중단했습니다") {
  return new Promise((resolve, reject) => {
    let t;
    const arm = () => { clearTimeout(t); t = setTimeout(() => reject(Object.assign(new Error(label), { name: "TimeoutError" })), idleMs); };
    arm();
    start(arm).then((v) => { clearTimeout(t); resolve(v); }, (e) => { clearTimeout(t); reject(e); });
  });
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = h("div", { class: "toast", role: "status", text: msg });
  document.body.append(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2400);
}

function download(filename, blobOrText, type = "text/plain;charset=utf-8") {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], { type });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const safeFilename = (s) => (s || "회의").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60) || "회의";

/* ───────────────────────── 설정 ───────────────────────── */

const Settings = {
  KEY: "voicenote.settings.v1",
  // localSpeech는 기본 꺼짐 — SpeechRecognition.available()이 Chromium 153 헤드리스에서
  // 탭을 크래시시키는 것을 확인했다. 실기기에서 안전하다는 확인 전까지는 실험 옵션으로 둔다.
  v: { saveAudio: true, localSpeech: false, external: false, email: "", speechLang: "ko", targetLang: "en" },
  load() {
    try { Object.assign(this.v, JSON.parse(localStorage.getItem(this.KEY) || "{}")); } catch {}
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.v)); } catch {}

/* ───────────────────────── 저장소 ─────────────────────────
   텍스트(자막·정리)는 localStorage, 녹음 파일은 IndexedDB.
   목록은 가벼운 인덱스만 따로 둬서 회의가 쌓여도 목록이 느려지지 않게 한다. */

const Store = {
  INDEX: "voicenote.index.v1",
  key: (id) => `voicenote.session.${id}`,
  list() {
    try { return JSON.parse(localStorage.getItem(this.INDEX) || "[]").sort((a, b) => b.createdAt - a.createdAt); }
    catch { return []; }
  },
  get(id) {
    try { return JSON.parse(localStorage.getItem(this.key(id)) || "null"); } catch { return null; }
  },
  save(s) {
    const meta = { id: s.id, title: s.title || autoTitle(s), createdAt: s.createdAt, durationMs: s.durationMs, count: s.segments.length, audioParts: s.audioParts || 0 };
    try {
      localStorage.setItem(this.key(s.id), JSON.stringify(s));
      const idx = this.list().filter((m) => m.id !== s.id);
      idx.push(meta);
      localStorage.setItem(this.INDEX, JSON.stringify(idx));
      return true;
    } catch (e) {
      // 용량 초과 — 녹음은 계속되고, 사용자에게만 알린다.
      UI.banner("저장 공간이 부족해 회의 내용을 저장하지 못했습니다. 오래된 회의를 지우거나 내보내기로 백업해 주세요.", "error", "quota");
      return false;
    }
  },
  remove(id) {
    const parts = this.list().find((m) => m.id === id)?.audioParts || 0; // 인덱스에서 지우기 전에 읽는다
    localStorage.removeItem(this.key(id));
    localStorage.setItem(this.INDEX, JSON.stringify(this.list().filter((m) => m.id !== id)));
    Audio_.removeAll(id, parts).catch(() => {});
  },
};

/** 녹음 파일 — IndexedDB. 회의 하나에 여러 조각(이어서 녹음)을 담을 수 있다. */
const Audio_ = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) return reject(new Error("no idb"));
      const req = indexedDB.open("voicenote", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("audio");
      req.onsuccess = () => resolve((this.db = req.result));
      req.onerror = () => reject(req.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const t = db.transaction("audio", mode);
      const r = fn(t.objectStore("audio"));
      t.oncomplete = () => resolve(r?.result);
      t.onerror = () => reject(t.error);
    });
  },
  put(id, part, blob) { return this.tx("readwrite", (s) => s.put(blob, `${id}:${part}`)); },
  get(id, part) { return this.tx("readonly", (s) => s.get(`${id}:${part}`)); },
  async removeAll(id, parts) {
    const n = Math.max(parts || 0, 1);
    await this.tx("readwrite", (s) => { for (let i = 0; i < n; i++) s.delete(`${id}:${i}`); });
  },
};

/* ═════════════════════════════════════════════════════════════════
   규칙 기반 회의 정리
